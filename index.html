<style>
/* 구성: 폰 세로 한 줄. 토요일 추첨 방송처럼 밤하늘 남색 바탕에 금색, 공은 반짝이는 구슬 */
:root {
  --night: #070b24;
  --night-2: #141d52;

  --gold-deep: #c8901c;

  --bad: #ff8a98;

  --red: var(--gold);
  --display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;

}
html { background: var(--night); }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  min-height: 100vh; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;

    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.75), transparent 60%),

    radial-gradient(1px 1px at 28% 47%, rgba(255,255,255,0.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 90% 58%, rgba(255,255,255,0.6), transparent 60%),
    radial-gradient(1px 1px at 8% 76%, rgba(255,240,200,0.55), transparent 60%),
    radial-gradient(1px 1px at 52% 88%, rgba(255,255,255,0.45), transparent 60%),
    radial-gradient(120% 60% at 50% -10%, #2a3a9a 0%, var(--night-2) 38%, var(--night) 75%);
  background-attachment: fixed;
}
.wrap { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 32px; display: grid; gap: 16px; }
h1 {
  font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; margin: 0; letter-spacing: 0.03em;
  background: linear-gradient(180deg, var(--gold-2) 10%, var(--gold) 55%, var(--gold-deep) 100%);

}

.update:disabled { opacity: 0.6; cursor: wait; }

.status.good { color: var(--ink); }

.game:first-child { border-top: 0; }

  width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; color: #ffffff; font-weight: 600; font-size: 14px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55); font-variant-numeric: tabular-nums;

  60% { opacity: 1; transform: translateY(3px) scale(1.06) rotate(10deg); }

}
.ready { display: grid; justify-items: center; gap: 12px; padding: 22px 12px; border: 1.5px dashed var(--rule); border-radius: 16px; background: rgba(23, 31, 82, 0.4); text-align: center; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.notice { margin: 0; color: var(--bad); font-size: 14px; }

summary::marker { color: var(--gold); }
details > div { display: grid; gap: 10px; padding-bottom: 14px; }
.small { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.patterns { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.patterns li { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--rule); }
.chart, .axis { display: grid; grid-template-columns: repeat(45, 1fr); gap: 1px; }
.chart { height: 96px; align-items: end; }
.bar { border-radius: 2px 2px 0 0; min-height: 2px; }
.axis { font-size: 10px; color: var(--muted); }
.axis span { text-align: center; white-space: nowrap; }
.reasons { margin: 0; padding-left: 18px; font-variant-numeric: tabular-nums; }
.disclaimer { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
@media (prefers-reduced-motion: reduce) {
  #draw:active { transform: none; }
  .ball.drop { animation: none; }
}

<script>// 로또 추첨기 폰 버전 — 계산만 한다(화면을 모른다). 설계: docs\2026-10-09-폰버전-설계.md
(function (root) {
  "use strict";

  const BANDS = [[1, 10], [11, 20], [21, 30], [31, 40], [41, 45]];
  const ALL_ODDS = [0, 1, 2, 3, 4, 5, 6];

  /** 다섯 구간(1~10, 11~20, 21~30, 31~40, 41~45)에 든 번호 개수. 예: "1-2-1-1-1" */
  function bandShape(numbers) {
    return BANDS.map(([lo, hi]) => numbers.filter((n) => n >= lo && n <= hi).length).join("-");
  }

  /** 회차 순서로 맨 뒤 size개. */
  function recent(draws, size = 100) {
    return [...draws].sort((a, b) => a.draw - b.draw).slice(-size);
  }

  /** 많이 나온 번호대 모양 size개. 횟수가 같으면 더 최근에 나온 모양이 먼저. */
  function topPatterns(draws, size = 20) {
    const byShape = new Map();
    for (const draw of draws) {
      const shape = bandShape(draw.numbers);
      const item = byShape.get(shape) || { shape, count: 0, last: 0 };
      item.count += 1;
      item.last = Math.max(item.last, draw.draw);
      byShape.set(shape, item);
    }
    return [...byShape.values()].sort((a, b) => b.count - a.count || b.last - a.last).slice(0, size);
  }

  function oddCount(numbers) {
    return numbers.filter((n) => n % 2 === 1).length;
  }

  function total(numbers) {
    return numbers.reduce((sum, n) => sum + n, 0);
  }

  /** 시험 게임이 따를 조건: 5번 이상 나온 홀수 개수, 합계 10~90 백분위(양 끝 포함). */
  function auxConditions(draws) {
    if (draws.length === 0) return { odds: ALL_ODDS, sumMin: 21, sumMax: 255 };
    const tally = new Array(7).fill(0);
    for (const draw of draws) tally[oddCount(draw.numbers)] += 1;
    const odds = ALL_ODDS.filter((k) => tally[k] >= 5);
    const sums = draws.map((draw) => total(draw.numbers)).sort((a, b) => a - b);
    const last = sums.length - 1;
    return {
      odds: odds.length ? odds : ALL_ODDS,
      sumMin: sums[Math.floor(last * 0.1)],
      sumMax: sums[Math.ceil(last * 0.9)],
    };
  }

  /** seed로 늘 같은 순서를 내는 난수(0 이상 1 미만, mulberry32). 검사에서 결과를 고정하려고 쓴다. */
  function makeRng(seed) {
    let state = seed >>> 0;
    return function () {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 가중치에 비례하는 확률로 칸 번호 하나. */
  function weightedIndex(weights, rng) {
    let r = rng() * weights.reduce((sum, w) => sum + w, 0);
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r < 0) return i;
    }
    return weights.length - 1;
  }

  /** lo~hi에서 서로 다른 번호 k개(같은 확률). */
  function sampleRange(lo, hi, k, rng) {
    const pool = [];
    for (let n = lo; n <= hi; n++) pool.push(n);
    const picked = [];
    for (let i = 0; i < k; i++) picked.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
    return picked;
  }

  function gameFromShape(shape, rng) {
    const counts = shape.split("-").map(Number);
    const numbers = [];
    BANDS.forEach(([lo, hi], i) => numbers.push(...sampleRange(lo, hi, counts[i], rng)));
    return numbers.sort((a, b) => a - b);
  }

  function fitsAux(numbers, aux) {
    const sum = total(numbers);
    return aux.odds.includes(oddCount(numbers)) && sum >= aux.sumMin && sum <= aux.sumMax;
  }

  /** 패턴(횟수 비례)대로 시험 게임 count개. 보조 조건을 maxRetry번 안에 못 맞추면 조건 없이 남기고 relaxed로 센다. */
  function trialGames(patterns, aux, count, rng, maxRetry = 1000) {
    const games = [];
    let relaxed = 0;
    if (patterns.length === 0) return { games, relaxed };
    const weights = patterns.map((p) => p.count);
    const draw = () => gameFromShape(patterns[weightedIndex(weights, rng)].shape, rng);
    for (let g = 0; g < count; g++) {
      let game = null;
      for (let t = 0; t < maxRetry && !game; t++) {
        const candidate = draw();
        if (fitsAux(candidate, aux)) game = candidate;
      }
      if (!game) {
        game = draw();
        relaxed += 1;
      }
      games.push(game);
    }
    return { games, relaxed };
  }

  /** 번호별 나온 횟수. counts[n]이 n번 횟수(0번 칸은 안 씀). */
  function countNumbers(games) {
    const counts = new Array(46).fill(0);
    for (const game of games) for (const n of game) counts[n] += 1;
    return counts;
  }

  /** 횟수가 많은 번호 size개. 횟수가 같으면 작은 번호가 먼저(PC판 top_pool과 같다). */
  function topPool(counts, size = 12) {
    const numbers = [];
    for (let n = 1; n <= 45; n++) numbers.push(n);
    return numbers.sort((a, b) => counts[b] - counts[a] || a - b).slice(0, size);
  }

  /** pool에서 가중치대로 6개를 하나씩 빼며 뽑는다(PC판 pick_combos의 한 게임). 오름차순. */
  function pickCombo(pool, weights, rng) {
    const left = [...pool], leftWeights = [...weights], combo = [];
    for (let i = 0; i < 6; i++) {
      const index = weightedIndex(leftWeights, rng);
      combo.push(left.splice(index, 1)[0]);
      leftWeights.splice(index, 1);
    }
    return combo.sort((a, b) => a - b);
  }

  const REASONS = ["birthday", "line", "even", "consecutive", "past"];

  /** 남들이 많이 고르는 조합이면 그 이유, 아니면 null. 용지는 가로 7칸(1~7, 8~14, …). */
  function rejectReason(combo, pastDraws, skip = []) {
    if (!skip.includes("birthday") && combo.every((n) => n <= 31)) return "birthday";
    const rows = new Set(combo.map((n) => Math.floor((n - 1) / 7)));
    const cols = new Set(combo.map((n) => (n - 1) % 7));
    if (rows.size === 1 || cols.size === 1) return "line";
    const gap = combo[1] - combo[0];
    if (combo.every((n, i) => i === 0 || n - combo[i - 1] === gap)) return "even";
    for (let i = 2; i < combo.length; i++) {
      if (combo[i] - combo[i - 1] === 1 && combo[i - 1] - combo[i - 2] === 1) return "consecutive";
    }
    for (const draw of pastDraws) {
      if (draw.numbers.filter((n) => combo.includes(n)).length >= 5) return "past";
    }
    return null;
  }

  /** 후보 안에서 횟수를 가중치로(0회는 0.1) 걸러내기를 통과한 서로 다른 조합 count개. 최대 maxTries번 뽑는다. */
  function finalGames(pool, counts, pastDraws, rng, count = 5, maxTries = 5000, skip = []) {
    const weights = pool.map((n) => counts[n] || 0.1);
    const rejected = Object.fromEntries(REASONS.map((reason) => [reason, 0]));
    const games = [];
    for (let t = 0; t < maxTries && games.length < count; t++) {
      const combo = pickCombo(pool, weights, rng);
      const reason = rejectReason(combo, pastDraws, skip);
      if (reason) rejected[reason] += 1;
      else if (!games.some((g) => g.join() === combo.join())) games.push(combo);
    }
    return { games, rejected };
  }

  /** 1~4단계를 한 번에 돈다. 화면은 이 결과만 보고 그린다. */
  function recommend(allDraws, rng = Math.random, options = {}) {
    const o = Object.assign({ recent: 100, patterns: 20, trials: 100, pool: 12, games: 5, skip: [] }, options);
    const basisDraws = recent(allDraws, o.recent);
    const patterns = topPatterns(basisDraws, o.patterns);
    const aux = auxConditions(basisDraws);
    const trial = trialGames(patterns, aux, o.trials, rng);
    const counts = countNumbers(trial.games);
    const pool = trial.games.length ? topPool(counts, o.pool) : [];
    // 후보가 모두 31 이하면 어떤 조합도 '생일 숫자'로 걸러지므로 5000번 뽑지 않고 바로 끝낸다
    const impossible = pool.length && !o.skip.includes("birthday") && pool.every((n) => n <= 31) ? "birthday" : null;
    const final = pool.length && !impossible
      ? finalGames(pool, counts, allDraws, rng, o.games, 5000, o.skip)
      : { games: [], rejected: Object.fromEntries(REASONS.map((reason) => [reason, 0])) };
    const basis = basisDraws.length
      ? { from: basisDraws[0].draw, to: basisDraws[basisDraws.length - 1].draw, count: basisDraws.length }
      : { from: 0, to: 0, count: 0 };
    return { basis, patterns, aux, relaxed: trial.relaxed, counts, pool, games: final.games, rejected: final.rejected, impossible };
  }

  /**
   * [번호 뽑기]: 목표 게임 수(options.games, 기본 5)가 나올 때까지 recommend를 처음부터 다시(최대 tries번).
   * 그래도 모자라면 '생일 숫자' 조건만 풀고 한 번 더. 끝내 모자라면 게임이 가장 많은 결과(같으면 앞선 것).
   * 고른 결과를 통째로 돌려주므로 그래프·후보·걸러낸 수가 서로 맞는다.
   * attempts = 돌린 횟수, selectedAttempt = 고른 결과가 몇 번째였는지, relaxedBirthday = 조건을 푼 결과인지.
   */
  function recommendFull(allDraws, rng = Math.random, options = {}, tries = 5, run = recommend) {

const $ = (id) => document.getElementById(id);

function ballColor(n) {
  return BALL_COLORS[Math.floor((n - 1) / 10)];
}

function makeBall(n) {
  const ball = document.createElement("span");
  ball.className = "ball";
  ball.style.setProperty("--c", ballColor(n));
  ball.textContent = n;
  return ball;
}

function showCopyBox(text, button) {
  const box = $("copybox");
  box.textContent = text;
  box.hidden = false;
  const range = document.createRange();
  range.selectNodeContents(box);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  button.textContent = "길게 눌러 복사";
}

function copyGame(text, button) {
  const done = () => {
    button.textContent = "복사됨";
    setTimeout(() => { button.textContent = "복사"; }, 1500);
  };
  try {
    navigator.clipboard.writeText(text).then(done, () => showCopyBox(text, button));
  } catch (error) {
    showCopyBox(text, button);
  }
}

function renderGames(r, animate) {
  const list = $("games");
  list.replaceChildren();
  r.games.forEach((game, i) => {
    const item = document.createElement("li");
    item.className = "game";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "ABCDE"[i];
    const balls = document.createElement("div");
    balls.className = "balls";
    game.forEach((n, k) => {
      const ball = makeBall(n);
      if (animate) {
        ball.classList.add("drop");
        ball.style.animationDelay = `${(i * 6 + k) * 45}ms`;   // A줄부터 공이 하나씩 떨어진다
      }
      balls.append(ball);
    });
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy";
    button.textContent = "복사";
    button.addEventListener("click", () => copyGame(game.join(", "), button));
    item.append(label, balls, button);
    list.append(item);
  });
  list.hidden = r.games.length === 0;
  const short = $("short");
  short.hidden = r.games.length >= 5;
  short.textContent = r.games.length === 0
    ? "조건에 맞는 조합을 찾지 못했어요. 다시 뽑아 보세요."
    : `조건에 맞는 조합이 부족해 ${r.games.length}게임만 뽑았어요.`;
  $("copybox").hidden = true;
}

function renderPatterns(r) {
  $("patternTitle").textContent = `패턴 ${r.patterns.length}가지`;
  const list = $("patterns");
  list.replaceChildren();
  for (const p of r.patterns) {
    const item = document.createElement("li");
    const shape = document.createElement("span");
    shape.textContent = p.shape;
    const count = document.createElement("span");
    count.textContent = `${p.count}회`;
    item.append(shape, count);
    list.append(item);
  }
  $("aux").textContent = `시험 게임 조건: 홀수 ${r.aux.odds.join("·")}개, 번호 합계 ${r.aux.sumMin}~${r.aux.sumMax}`
    + (r.relaxed ? ` (조건을 못 맞춰 그냥 둔 게임 ${r.relaxed}개)` : "");
}

function renderChart(r) {
  const chart = $("chart");
  chart.replaceChildren();
  const top = Math.max(1, ...r.counts.slice(1));
  for (let n = 1; n <= 45; n++) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = `${(r.counts[n] / top) * 100}%`;
    bar.style.background = r.pool.includes(n) ? ballColor(n) : "var(--faint)";
    bar.title = `${n}번 ${r.counts[n]}회`;
    chart.append(bar);
  }
  const sorted = [...r.pool].sort((a, b) => a - b);
  $("pool").textContent = sorted.length ? `후보 ${sorted.length}개: ${sorted.join(", ")}` : "후보가 없어요.";
}

function renderRejected(r) {
  const sum = Object.values(r.rejected).reduce((s, v) => s + v, 0);
  $("rejectTitle").textContent = `이번 결과에서 걸러낸 조합 ${sum}개`;
  const list = $("reasons");
  list.replaceChildren();
  for (const reason of Lotto.REASONS) {
    const item = document.createElement("li");
    item.textContent = `${REASON_TEXT[reason]}: ${r.rejected[reason]}개`;
    list.append(item);
  }
}

function renderAxis() {
  const axis = $("axis");
  for (const n of [1, 10, 20, 30, 40, 45]) {
    const label = document.createElement("span");
    label.style.gridColumn = String(n);
    label.textContent = n;
    axis.append(label);
  }
}

const RESULT_BOXES = ["patternBox", "chartBox", "rejectBox"];

/** 위 기준 줄. 번호 추천과 같은 Lotto.recent(최근 100회)로 범위를 잡는다(뽑기 없이). */
function renderBasis() {
  const last = DRAWS[DRAWS.length - 1];
  const basis = Lotto.recent(DRAWS, 100);
  $("basis").textContent = last
    ? `${last.draw}회까지 (${last.date} 추첨) · 이번 기준 ${basis[0].draw}~${basis[basis.length - 1].draw}회`
    : "당첨번호가 없어요.";
}

let drawCount = 0;

/** 첫 화면: 뽑은 번호를 실제로 지우고 안내만 보인다(되돌리기라 게임 칸·부족 안내도 여기서 직접 비운다). */
function showStart() {
  $("games").replaceChildren();
  $("games").hidden = true;
  $("short").hidden = true;
  $("copybox").hidden = true;
  $("announce").textContent = "";
  for (const id of RESULT_BOXES) $(id).hidden = true;
  $("ready").hidden = false;
}

function render(r, animate = true) {
  renderBasis();
  renderGames(r, animate);   // 게임 칸·부족 안내는 renderGames만 정한다
  renderPatterns(r);
  renderChart(r);
  renderRejected(r);
  for (const id of RESULT_BOXES) $(id).hidden = false;
  $("ready").hidden = true;
  drawCount += 1;   // 같은 문장이면 화면 읽기 기능이 다시 안 읽을 수 있어 몇 번째인지 붙인다
  $("announce").textContent = (r.games.length ? `번호 ${r.games.length}게임을 뽑았어요` : $("short").textContent) + ` (${drawCount}번째)`;
}

function setStatus(text, tone) {
  const status = $("status");
  status.hidden = false;
  status.className = "status" + (tone ? " " + tone : "");
  status.textContent = text;
}

/** 동행복권 요청 하나. 전체 마감(deadline)과 요청당 10초 안에서. 실패는 종류별 updateError. */
function makeFetcher(deadline) {
  return async (params) => {
    if (navigator.onLine === false) throw Lotto.updateError("network");
    const left = deadline - Date.now();
    if (left <= 0) throw Lotto.updateError("timeout");
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), Math.min(left, 10000));
    try {
      const query = new URLSearchParams(params).toString();
      let response;
      try {
        response = await fetch(API + (query ? "?" + query : ""), { cache: "no-store", credentials: "omit", signal: ctrl.signal });
      } catch (_) {
        throw Lotto.updateError(ctrl.signal.aborted ? "timeout" : "network");
      }
      if (!response.ok) throw Lotto.updateError("server");
      let body;
      try {
        body = await response.text();   // 받는 도중 끊김
      } catch (_) {
        throw Lotto.updateError(ctrl.signal.aborted ? "timeout" : "network");
      }
      try {
        return JSON.parse(body);         // 점검 화면 같은 JSON 아닌 응답
      } catch (_) {
        throw Lotto.updateError("server");
      }
    } finally {
      clearTimeout(timer);
    }
  };
}

/** 다른 창이 그 사이 저장한 것과 합쳐 저장. 여러 창이 동시에 저장하지 않게 잠금 안에서. 실패하면 던진다. */
async function save(draws) {
  const write = () => {
    localStorage.setItem(STORE_KEY, Lotto.mergeForSave(EMBEDDED, localStorage.getItem(STORE_KEY), draws));
  };
  if (navigator.locks && navigator.locks.request) await navigator.locks.request("srlotto-save", async () => write());
  else write();
}

/** 묶음 하나를 받을 때마다: 추천 계산 → 자료·화면 교체 → 저장(이 순서). */
async function applyChunk(draws) {
  DRAWS = draws;
  renderBasis();
  showStart();   // 보이던 번호는 옛 자료로 뽑은 것이라 지운다
  await save(draws);
}

function updateMessage(r) {
  const last = r.draws.length ? r.draws[r.draws.length - 1].draw : 0;
  let text;
  if (r.error) {
    const reason = ERROR_TEXT[r.error.kind] || ERROR_TEXT.network;
    text = r.added ? `${last}회까지 받았어요. 그 뒤는 못 받았어요: ${reason} [번호 뽑기]를 눌러 새 자료로 뽑아 보세요.` : reason;
  } else if (r.added) {
    text = `${last}회까지 받았어요 (새 회차 ${r.added}개). [번호 뽑기]를 눌러 새 자료로 뽑아 보세요.`;
  } else {
    text = `이미 최신이에요 (${last}회).`;
  }
  if (r.saveFailed) text += " 폰에 저장하지 못해 이번에만 반영돼요.";
  return text;
}

async function onUpdate() {
  const button = $("update");
  if (button.disabled) return;
  button.disabled = true;
  $("draw").disabled = true;   // 받는 동안 뽑은 번호가 다음 묶음에서 지워지지 않게
  button.textContent = "받는 중…";
  setStatus("동행복권에서 확인하는 중…", "");
  try {
    const r = await Lotto.fetchNew(DRAWS, makeFetcher(Date.now() + 30000), applyChunk);
    setStatus(updateMessage(r), r.error ? "bad" : "good");
  } catch (_) {
    setStatus("뜻밖의 문제가 생겼어요. 다시 눌러 주세요.", "bad");
  } finally {
    button.disabled = false;
    $("draw").disabled = false;
    button.textContent = "↻ 업데이트";
  }
}

window.__srlotto = { draws: () => DRAWS };
renderAxis();
$("draw").addEventListener("click", () => render(Lotto.recommendFull(DRAWS)));
if (HOME) {
  $("update").hidden = false;
  $("update").addEventListener("click", onUpdate);
} else {
  $("moved").hidden = false;
}
renderBasis();
showStart();
</script>
<script>
(() => {
  "use strict";
  try {
    if (!(isSecureContext && "serviceWorker" in navigator &&
        (location.hostname.endsWith("github.io") || location.hostname === "localhost" ||
         location.hostname === "127.0.0.1"))) return;

    const PREPARING = "오프라인 준비 중…";
    const UNAVAILABLE = "오프라인 준비 안 됨 — 인터넷 연결 후 다시 열어 주세요";
    let registration = null;
    let hadController = !!navigator.serviceWorker.controller;
    let lastUpdate = -Infinity;
    let applying = false;
    let checking = false;
    let reloading = false;
    // 새 버전은 [지금 적용]을 눌렀을 때만 바꾼다(보던 번호가 갑자기 바뀌지 않게).
    // 앱을 완전히 닫았다 열면 브라우저가 알아서 새 버전을 쓴다.
    let applyRequested = false;
    const safe = () => applyRequested;

    function show(text, offerApply) {
      try {
        const wrap = document.querySelector(".wrap");
        if (!wrap) return;
        let state = document.getElementById("appState");
        if (!state) {
          state = document.createElement("p");
          state.id = "appState";
          state.className = "appState";
          state.setAttribute("role", "status");
          wrap.appendChild(state);
        }
        state.textContent = text;
        if (offerApply) {
          const button = document.createElement("button");
          button.type = "button";
          button.id = "appStateApply";
          button.textContent = "지금 적용";
          button.addEventListener("click", () => { requestApply(button).catch(() => {}); });
          state.append(" ", button);
        }
      } catch (_) {}
    }

    function message(worker, command) {
      return new Promise((resolve, reject) => {
        let channel;
        let timer;
        const finish = (error, data) => {
          clearTimeout(timer);
          if (channel) { channel.port1.close(); channel.port2.close(); }
          if (error) reject(error); else resolve(data);
        };
        try {
          if (!worker) throw new Error("서비스 워커 없음");
          channel = new MessageChannel();
          timer = setTimeout(() => finish(new Error("서비스 워커 응답 시간 초과")), 5000);
          channel.port1.onmessage = event => finish(null, event.data);
          channel.port1.onmessageerror = () => finish(new Error("서비스 워커 응답 오류"));
          worker.postMessage(command, [channel.port2]);
        } catch (error) { finish(error); }
      });
    }

    async function status() {
      if (checking) return;
      checking = true;
      try {
        const worker = navigator.serviceWorker.controller || (registration && registration.active);
        if (!worker) {
          show(!registration || registration.installing ? PREPARING : UNAVAILABLE);
          return;
        }
        const data = await message(worker, "status");
        if (worker !== (navigator.serviceWorker.controller || (registration && registration.active))) return;
        if (!data.ready) { show(UNAVAILABLE); return; }
        const waiting = registration && registration.waiting;
        const fresh = waiting && !applyRequested ? await message(waiting, "status").catch(() => null) : null;
        if (fresh && fresh.ready && fresh.version !== data.version) {
          if (!document.getElementById("appStateApply")) show("새 버전이 준비됐어요 · v" + fresh.version.slice(0, 6), true);
          return;
        }
        if (!applyRequested) show("오프라인 준비 완료 · v" + data.version.slice(0, 6));
      } catch (_) { show(UNAVAILABLE); }
      finally { checking = false; }
    }

    // [지금 적용]: 대기 중인 새 버전에 적용을 부탁하고, 거절·실패면 안내와 버튼을 되돌린다.
    async function requestApply(button) {
      if (applyRequested || reloading) return;
      applyRequested = true;
      button.disabled = true;
      let result = null;
      try {
        const worker = registration && registration.waiting;
        if (worker) result = await message(worker, "apply");
      } catch (_) {}
      if (result && result.applied) {
        // 보통 곧 controllerchange로 새로고침된다. 10초 안에 안 되면 되돌린다.
        setTimeout(() => { if (!reloading) { applyRequested = false; status().catch(() => {}); } }, 10000);
        return;
      }
      applyRequested = false;
      show(result && result.reason === "window-count"
        ? "로또 추첨기가 " + (result.windows || "여러") + "개 열려 있어요. 다른 창을 닫고 다시 눌러 주세요."
        : "새 버전을 적용하지 못했어요. 다시 눌러 주세요.", true);
    }

    async function applyWaiting() {
      if (applying || reloading || !registration || !registration.waiting || !safe()) return;
      applying = true;
      try {
        const worker = registration.waiting;
        const data = await message(worker, "status");
        if (data.ready && worker === registration.waiting && safe()) await message(worker, "apply");
      } catch (_) {}
      finally { applying = false; }
    }

    async function update() {
      try {
        // 인터넷이 없으면 확인하지 않아요(비행기 모드에서 콘솔 오류 방지)
        if (!registration || navigator.onLine === false || performance.now() - lastUpdate < 60000) return;
        lastUpdate = performance.now();
        await registration.update();
      } catch (_) {}
      finally { await status(); await applyWaiting(); }
    }

    async function controllerChanged() {
      const existed = hadController;
      hadController = !!navigator.serviceWorker.controller;
      try {
        const worker = navigator.serviceWorker.controller;
        if (existed && worker && safe() && !reloading) {
          const data = await message(worker, "status");
          if (data.ready && safe() && worker === navigator.serviceWorker.controller) {
            const key = "srlotto-reloaded-" + data.version;
            // 같은 버전으로 두 번 새로고침하지 않게 표시해 둔다. 저장소가 막혀도 이 문서에서 한 번은 새로고침한다
            // (새로고침 뒤에는 applyRequested가 false라 다시 새로고침하지 않는다).
            let seen = false;
            try {
              seen = !!sessionStorage.getItem(key);
              if (!seen) sessionStorage.setItem(key, "1");
            } catch (_) {}
            if (!seen) {
              reloading = true;
              location.reload();
              return;
            }
          }
        }
      } catch (_) {}
      await status();
      await applyWaiting();
    }

    async function start() {
      show(PREPARING);
      try {
        if (navigator.storage && navigator.storage.persist) {
          Promise.resolve(navigator.storage.persist()).catch(() => {});
        }
      } catch (_) {}
      try {
        navigator.serviceWorker.addEventListener("controllerchange", () => { controllerChanged().catch(() => {}); });
        registration = await navigator.serviceWorker.register("./sw.js", {scope: "./", updateViaCache: "none"});
        const watch = worker => {
          try {
            if (!worker) return;
            worker.addEventListener("statechange", () => {
              status().catch(() => {});
              applyWaiting().catch(() => {});
            });
          } catch (_) {}
        };
        registration.addEventListener("updatefound", () => { watch(registration.installing); });
        watch(registration.installing);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") update().catch(() => {});
        });
        window.addEventListener("online", () => { update().catch(() => {}); });
        // Retry a deferred application when the player returns to title/select
        // or another window closes; polling never calls registration.update().
        setInterval(() => { status().catch(() => {}); applyWaiting().catch(() => {}); }, 1500);
        await status();
        await applyWaiting();
        await update();
      } catch (_) { show(UNAVAILABLE); }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => { start().catch(() => { show(UNAVAILABLE); }); }, {once: true});
    } else { start().catch(() => { show(UNAVAILABLE); }); }
  } catch (_) {}
})();
</script>
</html>
